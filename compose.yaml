services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pond
      POSTGRES_PASSWORD: pond
      POSTGRES_DB: pond_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pond_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pond"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pond_db:
